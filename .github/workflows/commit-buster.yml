name: Update Commit Buster Animation

on:
  schedule:
    - cron: '30 0 * * *' # Runs daily at 00:30 UTC
  workflow_dispatch: # Allows manual run anytime

jobs:
  update-buster:
    name: Generate Commit Buster Arcade Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow

      - name: Run Commit Buster Generator
        run: python scripts/generate_commit_buster.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add commit_buster.gif
          git diff --staged --quiet || (git commit -m "chore: update commit buster arcade animation [skip ci]" && git push)
