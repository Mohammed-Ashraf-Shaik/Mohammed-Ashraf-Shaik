  <!-- Blinking cursor ? moves right as chars appear, fades out when done -->
  <rect x="50%" y="12" width="2" height="28" fill="#39d353" rx="1" opacity="1">
    <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1" begin="3.3s" dur="9999s" fill="freeze"/>
